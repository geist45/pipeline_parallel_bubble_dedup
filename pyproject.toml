[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geist45-pipeline_parallel_bubble_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出算子库维护工程师·流水线并行气泡比例上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "geist45" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://geist45.github.io"
Repository = "https://github.com/geist45/pipeline_parallel_bubble_dedup"
Issues = "https://github.com/geist45/pipeline_parallel_bubble_dedup/issues"

[project.scripts]
pipeline_parallel_bubble_dedup = "pipeline_parallel_bubble_dedup:main"

[tool.setuptools]
py-modules = ["pipeline_parallel_bubble_dedup"]
